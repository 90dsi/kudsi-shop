<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choose a new password — Kudsi Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/ui.css?v=5" />
</head>
<body class="auth-body">
  <main class="reset-wrap">
    <div class="reset-card glass">
      <a class="auth-brand" href="/" style="margin-bottom:1.3rem">
        <span class="brand-mark">K</span>
        <span><span data-app-name>Kudsi Shop</span></span>
      </a>

      <div id="loadingState" class="stack" style="gap:0.8rem">
        <div class="skeleton" style="height:26px;width:70%"></div>
        <div class="skeleton" style="height:14px;width:95%"></div>
        <div class="skeleton" style="height:14px;width:80%"></div>
        <div class="skeleton" style="height:48px;margin-top:0.6rem"></div>
        <div class="skeleton" style="height:48px"></div>
      </div>

      <div id="formState" hidden>
        <span class="eyebrow">Secure link</span>
        <h1 style="margin-top:0.8rem">Choose a new password</h1>
        <p class="sub" id="resetSub">This link works once and expires automatically.</p>

        <form id="resetForm" novalidate>
          <div class="field">
            <label for="password">New password</label>
            <input type="password" id="password" autocomplete="new-password" placeholder="At least 8 characters" />
            <div class="pw-meter" id="pwMeter" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
          </div>
          <div class="field">
            <label for="confirm">Confirm password</label>
            <input type="password" id="confirm" autocomplete="new-password" placeholder="Repeat your new password" />
          </div>
          <p class="form-error" id="resetError" hidden></p>
          <button class="btn btn-primary btn-full btn-glow" type="submit" id="resetBtn">Set new password</button>
        </form>
      </div>

      <div id="deadState" hidden>
        <div class="empty-state" style="border-style:solid">
          <span class="emoji" id="deadEmoji">⏳</span>
          <strong id="deadTitle">This link can't be used</strong>
          <p id="deadBody">Ask an admin for a fresh reset link.</p>
          <a class="btn btn-ghost btn-sm" id="deadContact" href="https://t.me/t4m31" target="_blank" rel="noopener">Contact support</a>
        </div>
      </div>

      <div id="doneState" hidden>
        <div class="success-burst">
          <svg viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="24" fill="none" stroke="currentColor" stroke-width="2"/><path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="m15 27 7 7 15-16"/></svg>
        </div>
        <h1>Password updated</h1>
        <p class="sub">You can now sign in with your new password.</p>
        <a class="btn btn-primary btn-full" href="/login.html">Go to sign in</a>
      </div>

      <p class="auth-alt"><a href="/login.html">← Back to sign in</a></p>
    </div>
  </main>

  <script src="/js/api.js?v=5"></script>
  <script>
    const token = new URLSearchParams(window.location.search).get("token") || "";
    const $ = (s) => document.querySelector(s);
    let account = null;

    function fail(title, body, emoji) {
      $("#loadingState").hidden = true;
      $("#formState").hidden = true;
      $("#deadState").hidden = false;
      $("#deadTitle").textContent = title;
      $("#deadBody").textContent = body;
      $("#deadEmoji").textContent = emoji || "⏳";
    }

    function strength(value) {
      let score = 0;
      if (value.length >= 8) score++;
      if (value.length >= 12) score++;
      if (/[A-Z]/.test(value) && /[a-z]/.test(value)) score++;
      if (/\d/.test(value) && /[^A-Za-z0-9]/.test(value)) score++;
      return score;
    }

    $("#password").addEventListener("input", () => {
      const score = strength($("#password").value);
      const bars = document.querySelectorAll("#pwMeter span");
      bars.forEach((bar, i) => {
        bar.className = i < score ? ["weak", "ok", "good", "great"][score - 1] || "" : "";
      });
    });

    $("#resetForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const password = $("#password").value;
      const confirm = $("#confirm").value;
      const errorBox = $("#resetError");
      errorBox.hidden = true;

      if (password.length < 8) {
        errorBox.textContent = "Password must be at least 8 characters.";
        errorBox.hidden = false;
        return;
      }
      if (password !== confirm) {
        errorBox.textContent = "Those passwords don't match.";
        errorBox.hidden = false;
        return;
      }

      const button = $("#resetBtn");
      button.disabled = true;
      button.textContent = "Saving…";
      try {
        await api.post("/api/auth/reset", { token, password });
        $("#formState").hidden = true;
        $("#doneState").hidden = false;
        setTimeout(() => (window.location.href = "/login.html"), 2600);
      } catch (error) {
        errorBox.textContent = error.message;
        errorBox.hidden = false;
        button.disabled = false;
        button.textContent = "Set new password";
      }
    });

    (async function init() {
      const site = await loadSite();
      const contact = (site && site.contact) || {};
      const link = contact.telegramLink || "https://t.me/t4m31";
      $("#deadContact").href = link;

      if (!token) {
        fail("No reset link", "Open the link an admin sent you, or request a new one.", "🔑");
        return;
      }
      try {
        const info = await api.get(`/api/auth/reset/${encodeURIComponent(token)}`);
        if (!info.valid) {
          const states = {
            used: ["This link was already used", "For your safety each link works only once. Ask for a new one.", "✅"],
            expired: ["This link has expired", "Reset links have a limited lifetime. Ask for a fresh one.", "⏳"],
            revoked: ["This link was replaced", "A newer reset link was generated. Use the most recent one.", "♻️"],
          };
          const [title, body, emoji] = states[info.state] || ["This link can't be used", "Ask an admin for a fresh reset link.", "⏳"];
          fail(title, body, emoji);
          return;
        }
        account = info;
        $("#loadingState").hidden = true;
        $("#formState").hidden = false;
        $("#resetSub").textContent = info.email
          ? `Set a new password for ${info.email}. This link works once.`
          : "This link works once and expires automatically.";
        $("#password").focus();
      } catch {
        fail("This link can't be used", "It may have expired. Ask an admin for a fresh reset link.", "⏳");
      }
    })();
  </script>
</body>
</html>
